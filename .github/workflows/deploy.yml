name: Create Release for UptickSDK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags
  # Re-publishes an existing tag, e.g. one whose run failed. A tag-push re-run uses the
  # workflow file from the tagged commit, so a fix here only reaches old tags this way.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, e.g. v1.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create_release:
    runs-on: warp-ubuntu-2204-x64-4x
    # The repository's default token is read-only; creating the release needs write.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}

    - name: Zip up the XCFramework
      run: zip -r UptickSDK.xcframework.zip UptickSDK.xcframework

    # For Logging the details of the github context & for testing purpose
    - name: Read the release commit message
      id: commit
      run: |
        {
          echo "message<<COMMIT_MESSAGE_EOF"
          git log -1 --format=%B
          echo "COMMIT_MESSAGE_EOF"
        } >> "$GITHUB_OUTPUT"

    # ios-sdk commits "Release v1.1.0 (2026.10.21+1)", so the release is named "1.1.0 (2026.10.21+1)" and maps back to the ios-sdk CalVer tag.
    - name: Name the release
      id: release_name
      env:
        COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
      run: |
        FIRST_LINE="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
        if [[ "$FIRST_LINE" =~ ^Release\ v?([0-9]+\.[0-9]+\.[0-9]+\ \(.+\))$ ]]; then
          NAME="${BASH_REMATCH[1]}"
        else
          NAME="Release $TAG"
        fi
        echo "Release name: $NAME"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ env.TAG }}
        name: ${{ steps.release_name.outputs.name }}
        body: ${{ steps.commit.outputs.message }}
        draft: false
        prerelease: false
        make_latest: true
        files: 'UptickSDK.xcframework.zip'
        fail_on_unmatched_files: false

  publish_to_cocoapods:
    runs-on: macos-latest
    needs: [create_release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TAG }}

    - name: Extract Version from Podspec
      id: version_extractor
      run: |
        VERSION=$(grep -E 'spec.version\s*=\s*"[^"]*"' UptickSDK.podspec | sed -E 's/.*spec.version\s*=\s*"([^"]*)".*/\1/')
        echo "Current version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
 
    - name: Setup Ruby and Cocoapods
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
 
    - name: Validate Podspec
      run: pod lib lint --allow-warnings --verbose
 
    - name: Publish to Cocoapods Trunk
      run: pod trunk push UptickSDK.podspec --allow-warnings --verbose
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
